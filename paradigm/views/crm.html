<div class="view-header">
          <h1>Custom CRM</h1>
          <button class="btn-action" onclick="openCRMModal()">Add Lead</button>
        </div>

        <!-- Stats Label -->
        <div class="summary-label">
          <span>Pipeline: <strong id="crm-total-pipeline">$0</strong></span>
          <span>Active Leads: <strong id="crm-active-leads">0</strong></span>
        </div>

        <!-- Client leads grid -->
        <div class="control-panel">
          <div class="search-wrapper">
            <svg
              class="search-icon-svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              class="search-input"
              id="crm-search-box"
              placeholder="Search client name..."
              oninput="filterCRMLeads()"
            />
          </div>
        </div>

        <div class="panel-card">
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Client Name</th>
                  <th>Deal Stage</th>
                  <th>Contract Value</th>
                  <th style="text-align: center">Actions</th>
                </tr>
              </thead>
              <tbody id="crm-table-body"></tbody>
            </table>
          </div>
        </div>
