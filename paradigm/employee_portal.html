<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Portal - Paradigm</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=3" />
    <link rel="manifest" href="manifest.json" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js");
        });
      }
    </script>
  </head>
  <body>
    <nav class="navbar">
      <h1>Paradigm Portal</h1>
      <div class="user-info">
        <span class="user-name" id="displayUsername">Loading...</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </nav>

    <div class="container">
      <div class="card full-width">
        <h2>Employee Profile</h2>
        <div class="profile-details" id="profileDetails">
          Loading profile information...
        </div>
      </div>

      <div class="card">
        <h2>Live Attendance</h2>
        <div style="text-align: center; margin: 16px 0">
          <div
            id="liveClock"
            style="
              font-size: 24px;
              font-weight: 600;
              font-family: monospace;
              letter-spacing: 2px;
              color: var(--accent);
            "
          >
            --:--:--
          </div>
          <div
            id="liveDate"
            style="
              font-size: 13px;
              color: var(--text-secondary);
              margin-top: 4px;
            "
          >
            ---
          </div>
        </div>
        <form id="attendanceForm">
          <button
            type="submit"
            class="submit-btn"
            style="padding: 14px; font-weight: 600; font-size: 15px"
          >
            MARK PRESENT NOW
          </button>
        </form>
        <div id="attMessage" class="message"></div>
      </div>

      <div class="card">
        <h2>Request Leave</h2>
        <form id="leaveForm">
          <div class="form-group">
            <label for="leaveType">Leave Type</label>
            <select id="leaveType" required>
              <option value="">Select type...</option>
              <option value="Annual">Annual Leave</option>
              <option value="Sick">Sick Leave</option>
              <option value="Personal">Personal Leave</option>
              <option value="Unpaid">Unpaid Leave</option>
            </select>
          </div>
          <div style="display: flex; gap: 12px">
            <div class="form-group" style="flex: 1">
              <label for="leaveStart">Start Date</label>
              <input type="date" id="leaveStart" required />
            </div>
            <div class="form-group" style="flex: 1">
              <label for="leaveEnd">End Date</label>
              <input type="date" id="leaveEnd" required />
            </div>
          </div>
          <div class="form-group">
            <label for="leaveReason">Reason</label>
            <textarea
              id="leaveReason"
              required
              placeholder="Briefly describe the reason for your leave..."
            ></textarea>
          </div>
          <button type="submit" class="submit-btn">Submit Request</button>
        </form>
        <div id="leaveMessage" class="message"></div>
      </div>

      <div class="card full-width">
        <h2>My Payslips</h2>
        <div id="payslipsContainer" style="margin-top: 16px">
          Loading payslips...
        </div>
      </div>
    </div>
    <!-- Closing container div was here -->

    <script src="js/employee_portal.js"></script>
  </body>
</html>
