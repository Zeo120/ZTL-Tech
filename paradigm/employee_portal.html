<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - Paradigm</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        h2, h3 { margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #007bff; }
        button {
            padding: 12px 24px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: #0056b3; }
        .message { margin-top: 10px; font-size: 14px; }
        .success { color: #4CAF50; }
        .error { color: #ff4d4d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-panel" id="employeeDetails">
            <h2>Welcome, <span id="empName">Loading...</span></h2>
            <p>Email: <span id="empEmail">...</span></p>
            <p>Department: <span id="empDept">...</span></p>
        </div>

        <div class="glass-panel">
            <h3>Mark Attendance</h3>
            <form id="attendanceForm">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="attDate" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="attStatus" required>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Half-Day">Half-Day</option>
                    </select>
                </div>
                <button type="submit">Submit Attendance</button>
                <div id="attMsg" class="message"></div>
            </form>
        </div>

        <div class="glass-panel">
            <h3>Request Leave</h3>
            <form id="leaveForm">
                <div class="form-group">
                    <label>Leave Type</label>
                    <input type="text" id="leaveType" required>
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="leaveStart" required>
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="leaveEnd" required>
                </div>
                <div class="form-group">
                    <label>Reason</label>
                    <textarea id="leaveReason" rows="3" required></textarea>
                </div>
                <button type="submit">Submit Leave Request</button>
                <div id="leaveMsg" class="message"></div>
            </form>
        </div>
    </div>

    <script>
        function getCsrfToken() {
            const match = document.cookie.match(new RegExp('(^| )ztl_csrf=([^;]+)'));
            return match ? match[2] : '';
        }

        const headers = {
            'Content-Type': 'application/json',
            'x-csrf-token': getCsrfToken()
        };

        async function fetchEmployee() {
            try {
                const res = await fetch('/api/employee/me', { headers });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('empName').textContent = data.name || 'Employee';
                    document.getElementById('empEmail').textContent = data.email || 'N/A';
                    document.getElementById('empDept').textContent = data.department || 'N/A';
                }
            } catch (err) {
                console.error('Failed to load employee details', err);
            }
        }
        fetchEmployee();

        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('attDate').value;
            const status = document.getElementById('attStatus').value;
            const msg = document.getElementById('attMsg');

            try {
                const res = await fetch('/api/employee/attendance', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ date, status })
                });
                if (res.ok) {
                    msg.textContent = 'Attendance submitted successfully';
                    msg.className = 'message success';
                } else {
                    msg.textContent = 'Failed to submit attendance';
                    msg.className = 'message error';
                }
            } catch (err) {
                msg.textContent = 'Error submitting attendance';
                msg.className = 'message error';
            }
        });

        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('leaveType').value;
            const start_date = document.getElementById('leaveStart').value;
            const end_date = document.getElementById('leaveEnd').value;
            const reason = document.getElementById('leaveReason').value;
            const msg = document.getElementById('leaveMsg');

            try {
                const res = await fetch('/api/employee/leaves', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ type, start_date, end_date, reason })
                });
                if (res.ok) {
                    msg.textContent = 'Leave request submitted successfully';
                    msg.className = 'message success';
                } else {
                    msg.textContent = 'Failed to submit leave request';
                    msg.className = 'message error';
                }
            } catch (err) {
                msg.textContent = 'Error submitting leave request';
                msg.className = 'message error';
            }
        });
    </script>
</body>
</html>
