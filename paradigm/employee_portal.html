<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - Paradigm</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(10, 10, 10, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent: #ffffff;
            --accent-hover: #dddddd;
            --input-bg: rgba(20, 20, 20, 0.6);
            --card-bg: rgba(15, 15, 15, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.03), transparent 30%),
                              radial-gradient(circle at 90% 90%, rgba(255, 255, 255, 0.03), transparent 30%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 24px;
        }

        .card h2 {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: 500;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            color-scheme: dark;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button.submit-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 8px;
        }

        button.submit-btn:hover {
            background: var(--accent-hover);
        }

        .message {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }
        
        .error { color: #ef4444; }
        .success { color: #10b981; }

        .profile-details p {
            margin: 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .profile-details span {
            color: var(--text-primary);
            font-weight: 500;
        }

        .full-width {
            grid-column: 1 / -1;
        }

    </style>
</head>
<body>

<nav class="navbar">
    <h1>Paradigm Portal</h1>
    <div class="user-info">
        <span class="user-name" id="displayUsername">Loading...</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container">
    <div class="card full-width">
        <h2>Employee Profile</h2>
        <div class="profile-details" id="profileDetails">
            Loading profile information...
        </div>
    </div>

    <div class="card">
        <h2>Live Attendance</h2>
        <div style="text-align: center; margin: 16px 0;">
            <div id="liveClock" style="font-size: 24px; font-weight: 600; font-family: monospace; letter-spacing: 2px; color: var(--accent);">--:--:--</div>
            <div id="liveDate" style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">---</div>
        </div>
        <form id="attendanceForm">
            <button type="submit" class="submit-btn" style="padding: 14px; font-weight: 600; font-size: 15px;">MARK PRESENT NOW</button>
        </form>
        <div id="attMessage" class="message"></div>
    </div>

    <div class="card">
        <h2>Request Leave</h2>
        <form id="leaveForm">
            <div class="form-group">
                <label for="leaveType">Leave Type</label>
                <select id="leaveType" required>
                    <option value="">Select type...</option>
                    <option value="Annual">Annual Leave</option>
                    <option value="Sick">Sick Leave</option>
                    <option value="Personal">Personal Leave</option>
                    <option value="Unpaid">Unpaid Leave</option>
                </select>
            </div>
            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label for="leaveStart">Start Date</label>
                    <input type="date" id="leaveStart" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="leaveEnd">End Date</label>
                    <input type="date" id="leaveEnd" required>
                </div>
            </div>
            <div class="form-group">
                <label for="leaveReason">Reason</label>
                <textarea id="leaveReason" required placeholder="Briefly describe the reason for your leave..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit Request</button>
        </form>
        <div id="leaveMessage" class="message"></div>
    </div>
</div>

<script>
    // Helper to get CSRF Token
    function getCsrfToken() {
        const name = 'ztl_csrf=';
        const decodedCookie = decodeURIComponent(document.cookie);
        const ca = decodedCookie.split(';');
        for(let i = 0; i <ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) == ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }
        return '';
    }

    // Helper to make authenticated requests
    async function apiRequest(url, options = {}) {
        const token = getCsrfToken();
        const headers = {
            'Content-Type': 'application/json',
            ...options.headers
        };
        
        if (token) {
            headers['x-csrf-token'] = token;
        }

        const config = {
            ...options,
            headers
        };

        const response = await fetch(url, config);
        
        // Handle unauthorized
        if (response.status === 401 || response.status === 403) {
            window.location.href = '/paradigm/login.html';
            throw new Error('Unauthorized');
        }
        
        return response;
    }

    // Load Employee Details
    async function loadEmployeeProfile() {
        try {
            const res = await apiRequest('/api/employee/me');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('displayUsername').textContent = data.name || data.email || 'Employee';
                
                let detailsHtml = '';
                if (data.email) detailsHtml += `<p>Email: <span>${data.email}</span></p>`;
                if (data.department) detailsHtml += `<p>Department: <span>${data.department}</span></p>`;
                if (data.role) detailsHtml += `<p>Role: <span>${data.role}</span></p>`;
                if (data.employee_id) detailsHtml += `<p>Employee ID: <span>${data.employee_id}</span></p>`;
                
                document.getElementById('profileDetails').innerHTML = detailsHtml || '<p>Profile data loaded successfully.</p>';
            } else {
                document.getElementById('profileDetails').innerHTML = '<p class="error">Failed to load profile data.</p>';
            }
        } catch (error) {
            console.error('Profile fetch error:', error);
        }
    }

    // Live Clock
    function updateClock() {
        const now = new Date();
        document.getElementById('liveClock').textContent = now.toLocaleTimeString();
        document.getElementById('liveDate').textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Set today's date as default for date inputs
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('leaveStart').value = today;
    document.getElementById('leaveEnd').value = today;

    // Handle Attendance Form
    document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('attMessage');
        msg.textContent = 'Submitting...';
        msg.className = 'message';

        if (!navigator.geolocation) {
            msg.textContent = 'Geolocation is not supported by your browser.';
            msg.className = 'message error';
            return;
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(now - offset)).toISOString().slice(0, -1);
            const date = localISOTime.split('T')[0];
            const status = 'Present';
            const deviceTime = now.toString();

            try {
                const res = await apiRequest('/api/employee/attendance', {
                    method: 'POST',
                    body: JSON.stringify({ date, status, device_time: deviceTime, latitude, longitude })
                });

                if (res.ok) {
                    msg.textContent = 'Attendance submitted successfully!';
                    msg.className = 'message success';
                    setTimeout(() => msg.textContent = '', 3000);
                } else {
                    const err = await res.json().catch(() => ({}));
                    msg.textContent = err.error || 'Failed to submit attendance.';
                    msg.className = 'message error';
                }
            } catch (error) {
                if (error.message !== 'Unauthorized') {
                    msg.textContent = 'Network error occurred.';
                    msg.className = 'message error';
                }
            }
        }, (error) => {
            msg.textContent = 'Location access is required to punch in.';
            msg.className = 'message error';
        });
    });

    // Handle Leave Form
    document.getElementById('leaveForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('leaveType').value;
        const start_date = document.getElementById('leaveStart').value;
        const end_date = document.getElementById('leaveEnd').value;
        const reason = document.getElementById('leaveReason').value;
        const msg = document.getElementById('leaveMessage');
        
        msg.textContent = 'Submitting...';
        msg.className = 'message';

        try {
            const res = await apiRequest('/api/employee/leaves', {
                method: 'POST',
                body: JSON.stringify({ type, start_date, end_date, reason })
            });

            if (res.ok) {
                msg.textContent = 'Leave request submitted successfully!';
                msg.className = 'message success';
                document.getElementById('leaveForm').reset();
                document.getElementById('leaveStart').value = today;
                document.getElementById('leaveEnd').value = today;
                setTimeout(() => msg.textContent = '', 3000);
            } else {
                const err = await res.json().catch(() => ({}));
                msg.textContent = err.error || 'Failed to submit leave request.';
                msg.className = 'message error';
            }
        } catch (error) {
            if (error.message !== 'Unauthorized') {
                msg.textContent = 'Network error occurred.';
                msg.className = 'message error';
            }
        }
    });

    // Logout
    function logout() {
        document.cookie = 'ztl_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        window.location.href = '/paradigm/login.html';
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', loadEmployeeProfile);
</script>

</body>
</html>
