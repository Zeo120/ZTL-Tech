<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paradigm | Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.json" />
    <script src="js/routes.js?v=9"></script>
    <script src="js/auth.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js");
        });
      }
    </script>
    <link rel="stylesheet" href="style.css?v=9" />
    <link rel="stylesheet" href="payroll_theme.css?v=1781416150715" />
    <script src="js/animations.js"></script>
  </head>
  <body>
    <!-- Cinematic Sequence Start -->
    <style>
      .top-header, .workspace-container, .sidebar-drawer {
        opacity: 0;
        pointer-events: none;
        transition: opacity 2.5s cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      .ui-revealed {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      #intro-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-color);
        transition: background 1s ease, opacity 1.5s ease;
      }
      #intro-screen.bg-faded {
        background: transparent;
      }
      #intro-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      /* Luxury VC Style Mask Reveal */
      .intro-logo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        height: 70px;
        padding-bottom: 5px;
      }

      .intro-logo-text {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 2.5rem;
        letter-spacing: -1px;
        color: var(--text-primary);
        text-transform: uppercase;
        transform: translateY(100%);
        opacity: 0;
        transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.2s ease;
      }

      .intro-logo-text.revealed {
        transform: translateY(0);
        opacity: 1;
      }
      
      .intro-logo-text span {
        color: #00ffaa;
      }
      
      .intro-line {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--text-primary);
        transition: width 1s cubic-bezier(0.25, 1, 0.5, 1), left 1s cubic-bezier(0.25, 1, 0.5, 1);
      }
      
      .intro-line.expanded {
        width: 100%;
        left: 0;
      }
    </style>

    <div id="intro-screen">
      <div class="intro-logo-container">
        <div class="intro-logo-text" id="intro-logo-text">PARADIGM<span>.</span></div>
        <div class="intro-line" id="intro-line"></div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Fade the solid background to transparent to reveal the particle matrix underneath
        setTimeout(() => {
          document.getElementById('intro-screen').classList.add('bg-faded');
        }, 50);

        // Step 1: Expand the line from the center outward
        setTimeout(() => {
          document.getElementById('intro-line').classList.add('expanded');
        }, 500);

        // Step 2: Slide the typography up from behind the invisible mask
        setTimeout(() => {
          document.getElementById('intro-logo-text').classList.add('revealed');
        }, 1300);

        // Step 3: Shatter the matrix and fade the screen
        setTimeout(() => {
          document.getElementById('intro-line').style.opacity = '0';
          window.isParticleMatrixShattered = true; // TRIGGER SHATTER!
          
          setTimeout(() => {
            document.getElementById('intro-screen').classList.add('hidden');
            document.querySelectorAll('.top-header, .workspace-container, .sidebar-drawer').forEach(el => el.classList.add('ui-revealed'));
            
            // Garbage collect the overlay
            setTimeout(() => {
              const s = document.getElementById('intro-screen');
              if (s) s.remove();
            }, 2000);
          }, 800);
        }, 3000);
      });
    </script>
    <!-- Cinematic Sequence End -->
    
    <!-- ZTL Omnipresent Background -->
    <canvas id="ag-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10; pointer-events: none; background: var(--bg-color);"></canvas>

    <script>
       // Global Antigravity Vanilla JS Animation (Canvas Engine)
       document.addEventListener('DOMContentLoaded', () => {
          const canvas = document.getElementById('ag-canvas');
          if(!canvas) return;
          const ctx = canvas.getContext('2d');
          
          let width = window.innerWidth;
          let height = window.innerHeight;
          canvas.width = width;
          canvas.height = height;

          window.addEventListener('resize', () => {
             width = window.innerWidth;
             height = window.innerHeight;
             canvas.width = width;
             canvas.height = height;
          });
          
          const numParticles = 250;
          const particles = [];
          
          for(let i=0; i<numParticles; i++) {
             const baseX = Math.random() * 100;
             const baseY = Math.random() * 100;
             
             // Massive Sphere/Orb Matrix Formation
             const angle = Math.random() * Math.PI * 2;
             const R = 25; 
             const targetX = 50 + Math.cos(angle) * R;
             const targetY = 50 + Math.sin(angle) * R;
             
             particles.push({
                x: targetX,
                y: targetY,
                vx: (Math.random() - 0.5) * 0.08,
                vy: (Math.random() - 0.5) * 0.08,
                baseX: baseX,
                baseY: baseY,
                diamondX: targetX,
                diamondY: targetY,
                r: Math.random() * 1.5 + 0.5,
                shattered: false
             });
          }
          
          let mouseX = 50;
          let mouseY = 50;
          let isClicked = false;
          window.isParticleMatrixShattered = false;
          let lineOpacity = 1;
          let fadeTriggered = false;

          let isLightMode = false;
          function updateThemeVars() {
             isLightMode = document.documentElement.getAttribute('data-theme') === 'light' || document.body.getAttribute('data-theme') === 'light';
          }
          const observer = new MutationObserver(updateThemeVars);
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
          observer.observe(document.body, { attributes: true, attributeFilter: ['data-theme'] });
          updateThemeVars();
          
          window.addEventListener('mousemove', (e) => {
             mouseX = (e.clientX / width) * 100;
             mouseY = (e.clientY / height) * 100;
             
             const heroLogo = document.getElementById('hero-logo');
             if (heroLogo && !isClicked && window.isParticleMatrixShattered) {
                 const rect = heroLogo.getBoundingClientRect();
                 const centerX = rect.left + rect.width/2;
                 const centerY = rect.top + rect.height/2;
                 const dx = e.clientX - centerX;
                 const dy = e.clientY - centerY;
                 const dist = Math.sqrt(dx*dx + dy*dy);
                 
                 if (dist < 150) {
                     heroLogo.style.transform = `scale(1.5) rotate(90deg) translate(${dx * 0.15}px, ${dy * 0.15}px)`;
                 } else {
                     heroLogo.style.transform = `scale(1) rotate(0deg) translate(0px, 0px)`;
                 }
             }
          });

          window.addEventListener('click', (e) => {
             const heroLogo = document.getElementById('hero-logo');
             if (heroLogo && window.isParticleMatrixShattered) {
                 const rect = heroLogo.getBoundingClientRect();
                 const centerX = rect.left + rect.width/2;
                 const centerY = rect.top + rect.height/2;
                 const dx = e.clientX - centerX;
                 const dy = e.clientY - centerY;
                 const dist = Math.sqrt(dx*dx + dy*dy);
                 
                 if (dist < 80) {
                     isClicked = true;
                     heroLogo.style.transform = `scale(0.8) rotate(360deg)`;
                     setTimeout(() => isClicked = false, 400);
                 }
             }
          });
          
          function animate() {
             ctx.clearRect(0, 0, width, height);
             
             // Draw Lines first so they are beneath particles
             ctx.beginPath();
             const cR = isLightMode ? 0 : 255;
             const cG = isLightMode ? 0 : 255;
             const cB = isLightMode ? 0 : 255;
             const currentLineOpacity = isLightMode ? Math.max(lineOpacity, 0.35) : lineOpacity;
             ctx.strokeStyle = `rgba(${cR}, ${cG}, ${cB}, ${currentLineOpacity})`;
             ctx.lineWidth = 1;

             for(let i=0; i<particles.length; i++) {
                const p = particles[i];
                
                if (window.isParticleMatrixShattered && !p.shattered) {
                   p.vx = (p.baseX - 50) * Math.random() * 0.08; 
                   p.vy = (p.baseY - 50) * Math.random() * 0.08;
                   p.shattered = true;
                   
                   if (i === 0 && !fadeTriggered) { 
                       fadeTriggered = true;
                       setTimeout(() => {
                           const fadeOut = setInterval(() => {
                               lineOpacity -= 0.02;
                               if(lineOpacity <= 0.04) {
                                   lineOpacity = 0.04;
                                   clearInterval(fadeOut);
                               }
                           }, 16);
                       }, 3000);
                   }
                }

                p.x += p.vx;
                p.y += p.vy;
                
                if (p.shattered) {
                   p.x += (p.baseX - p.x) * 0.02; 
                   p.y += (p.baseY - p.y) * 0.02;
                   
                   const dx = p.x - mouseX;
                   const dy = p.y - mouseY;
                   if(Math.sqrt(dx*dx + dy*dy) < 15) {
                      p.x += dx * 0.02;
                      p.y += dy * 0.02;
                   }
                } else {
                   p.x += (p.diamondX - p.x) * 0.1;
                   p.y += (p.diamondY - p.y) * 0.1;
                }
                
                const px1 = (p.x * width) / 100;
                const py1 = (p.y * height) / 100;

                for(let j=i+1; j<particles.length; j++) {
                    const p2 = particles[j];
                    const ddx = p.x - p2.x;
                    const ddy = p.y - p2.y;
                    const ddist = Math.sqrt(ddx*ddx + ddy*ddy);
                    const threshold = p.shattered ? 12 : 5; 
                    if (ddist < threshold) {
                        const px2 = (p2.x * width) / 100;
                        const py2 = (p2.y * height) / 100;
                        ctx.moveTo(px1, py1);
                        ctx.lineTo(px2, py2);
                    }
                }
             }
             ctx.stroke();

             // Draw Particles
             ctx.fillStyle = isLightMode ? "rgba(0, 0, 0, 0.85)" : "rgba(255, 255, 255, 0.7)";
             for(let i=0; i<particles.length; i++) {
                const p = particles[i];
                const px = (p.x * width) / 100;
                const py = (p.y * height) / 100;
                
                ctx.beginPath();
                ctx.arc(px, py, p.r, 0, Math.PI * 2);
                ctx.fill();
             }
             
             requestAnimationFrame(animate);
          }
          animate();
       });
    </script>

    <!-- Epic Portal Welcome Reveal Screen -->

    <!-- Fixed Header -->
    <header class="top-header">
      <div style="display: flex; align-items: center; gap: 0.8rem">
        <div
          class="logo-group"
          onclick="switchView('landing')"
          style="
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
          "
        >
          <div class="logo-diamond"></div>
          <span class="logo-text" id="logo-text-val"
            ><span class="logo-separator">|</span> PARADIGM</span
          >
        </div>

      </div>
      <button
        class="hamburger-btn"
        id="hamburger-toggle"
        onclick="toggleDrawer(true)"
        aria-label="Open Menu"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Right Drawer menu -->
    <div
      class="drawer-backdrop"
      id="drawer-backdrop"
      onclick="toggleDrawer(false)"
    ></div>
    <aside class="sidebar-drawer" id="sidebar-drawer">
    </aside>

    <!-- Main Workspace Area -->
    <main class="workspace-container">
      
      <!-- Landing / Dashboard View (Empty state exposing global background) -->
      <section class="view-panel active" id="view-landing"></section>

      <!-- CRM View -->
      <section class="view-panel" id="view-crm">
      </section>

      <!-- Operations View -->
      <section class="view-panel" id="view-ops">
      </section>

      <!-- Payroll View (Roster with Sub-tabs) -->
      <section class="view-panel" id="view-payroll">
      </section>
          <!-- Deep HR View -->
      <section class="view-panel" id="view-hr">
      </section>
      </main>

    <div id="modals"></div>

    <!-- JavaScript Module Logic -->
    <script>
      function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('paradigm_theme', newTheme);
      }
      
      // Initialize theme on load
      const savedTheme = localStorage.getItem('paradigm_theme');
      if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <script type="module" src="elements/index.js"></script>
    <script type="module" src="js/admin.js"></script>
    <script src="js/loader.js"></script>
  </body>
</html>
